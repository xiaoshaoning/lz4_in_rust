# CI: lint + test on Linux and Windows, and the differential tests against the C reference,
# built from a pinned upstream commit so the oracle cannot drift under us.
name: ci
on:
  push:
  pull_request:

env:
  LZ4_REPO: https://github.com/lz4/lz4
  LZ4_COMMIT: 1fb6b2129f710a9a5b0945b0b620e26ee1c60e64   # v1.11.1, the version this port targets

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: docs (broken intra-doc links are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: tests (fixtures are committed, no C toolchain needed)
        run: cargo test --release --workspace

      - name: differential tests against the C reference
        run: |
          set -eux
          git clone --quiet "$LZ4_REPO" /tmp/lz4
          git -C /tmp/lz4 checkout --quiet "$LZ4_COMMIT"
          cc -O2 -I/tmp/lz4/lib -o target/c-oracle tools/c_oracle.c \
             /tmp/lz4/lib/lz4.c /tmp/lz4/lib/lz4hc.c /tmp/lz4/lib/xxhash.c /tmp/lz4/lib/lz4frame.c
          # the whole suite: with the oracle in place the env-gated differential tests in
          # both tests/interop.rs and tests/frame_interop.rs run instead of skipping
          # 150 extra random cases on top of the fixed grid; a failure prints its seed
          LZ4_C_ORACLE=target/c-oracle LZ4_FUZZ_ROUNDS=150 \
            cargo test --release --workspace -- --nocapture

      # the port keeps indices in u32 in places (hc's 64 KiB tables); 32-bit usize must work
      - name: 32-bit build and tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib
          rustup target add i686-unknown-linux-gnu
          cargo test --release --target i686-unknown-linux-gnu --workspace

      # no big-endian runner exists; this at least proves the crate compiles there, and the
      # format work is from_le_bytes throughout by construction
      - name: big-endian compiles
        run: |
          rustup target add s390x-unknown-linux-gnu
          cargo check --target s390x-unknown-linux-gnu --workspace

      # the fixtures are only worth what the pinned upstream produces for them
      - name: the pinned C version still reproduces our fixture digests
        run: |
          test "$(target/c-oracle xxh32 tests/fixtures/text.raw)" = "5663fe8f"
          target/c-oracle unframe tests/fixtures/frame/text-1.lz4 /tmp/back.raw
          cmp /tmp/back.raw tests/fixtures/text.raw

  windows:
    runs-on: windows-latest
    # No job-wide msys2 shell: rustup puts cargo on the *Windows* PATH, which the msys2
    # shell does not inherit, so cargo steps run in Git bash and only the C build uses msys2.
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make gcc
      - uses: dtolnay/rust-toolchain@stable

      - name: tests
        shell: bash
        run: cargo test --release --workspace

      - name: build the C reference oracle (msys2 gcc)
        shell: msys2 {0}
        run: |
          set -eux
          git clone --quiet "$LZ4_REPO" /tmp/lz4
          git -C /tmp/lz4 checkout --quiet "$LZ4_COMMIT"
          mkdir -p target
          cc -O2 -I/tmp/lz4/lib -o target/c-oracle.exe tools/c_oracle.c \
             /tmp/lz4/lib/lz4.c /tmp/lz4/lib/lz4hc.c /tmp/lz4/lib/xxhash.c /tmp/lz4/lib/lz4frame.c

      - name: differential tests against the C reference
        shell: bash
        run: |
          set -eux
          LZ4_C_ORACLE=target/c-oracle.exe LZ4_FUZZ_ROUNDS=80 \
            cargo test --release --workspace -- --nocapture

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # undefined-behaviour check; the crate is #![forbid(unsafe_code)], so this mostly
      # guards the std interactions (slices, threads, I/O). Isolation is disabled because
      # some tests read the committed fixtures from disk.
      - name: miri
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo miri test --lib -- 'block::' 'xxhash::' 'level::' 'hc::' 
