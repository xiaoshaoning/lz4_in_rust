# CI: lint + test on Linux and Windows, and the differential tests against the C reference,
# built from a pinned upstream commit so the oracle cannot drift under us.
name: ci
on:
  push:
  pull_request:

env:
  LZ4_REPO: https://github.com/lz4/lz4
  LZ4_COMMIT: 1fb6b2129f710a9a5b0945b0b620e26ee1c60e64   # v1.11.1, the version this port targets

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: docs (broken intra-doc links are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps

      - name: tests (no C toolchain needed: fixtures are committed)
        run: cargo test --release

      - name: differential tests against the C reference
        run: |
          set -eux
          git clone --quiet "$LZ4_REPO" /tmp/lz4
          git -C /tmp/lz4 checkout --quiet "$LZ4_COMMIT"
          cc -O2 -I/tmp/lz4/lib -o target/c-oracle tools/c_oracle.c \
             /tmp/lz4/lib/lz4.c /tmp/lz4/lib/lz4hc.c /tmp/lz4/lib/xxhash.c
          LZ4_C_ORACLE=target/c-oracle cargo test --release --test interop -- --nocapture

      - name: the oracle itself must agree with our fixtures
        run: |
          target/c-oracle xxh32 tests/fixtures/text.raw

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make gcc
      - uses: dtolnay/rust-toolchain@stable

      - name: tests
        run: cargo test --release

      - name: differential tests against the C reference
        run: |
          set -eux
          git clone --quiet "$LZ4_REPO" /tmp/lz4
          git -C /tmp/lz4 checkout --quiet "$LZ4_COMMIT"
          mkdir -p target
          cc -O2 -I/tmp/lz4/lib -o target/c-oracle.exe tools/c_oracle.c \
             /tmp/lz4/lib/lz4.c /tmp/lz4/lib/lz4hc.c /tmp/lz4/lib/xxhash.c
          LZ4_C_ORACLE=target/c-oracle.exe cargo test --release --test interop -- --nocapture
